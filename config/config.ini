[Network]
; 设置不走代理的地址，防止本地 LLM 连接失败
no_proxy = localhost,127.0.0.1,0.0.0.0

[Whisper]
; 模型大小或本地路径，例如: medium 或 D:\Models\large-v3
model_size = large-v3
device = cuda
compute_type = float16

[Audio]
; 单次录音切片时长 (秒)
buffer_duration = 3.0
; 目标采样率
sample_rate = 16000
; VAD 静音检测阈值 (毫秒)
min_silence_ms = 500

[LLM]
; 本地大模型地址 (Ollama: http://localhost:11434/v1, LM Studio: http://localhost:1234/v1)
base_url = http://localhost:1234/v1
api_key = lm-studio
model_name = local-model